
services:
  mongodb:
    image: mongo:7.0
    restart: unless-stopped
    # Sales/purchase/return writes run inside transactions, which MongoDB only accepts on a
    # replica set member — so this runs as a single-member replica set instead of standalone.
    # A replica set with auth enabled also requires a keyFile, generated once into a volume.
    user: root
    entrypoint: ["bash", "-c"]
    command:
      - |
        set -eu
        KEYFILE=/key/mongo-keyfile
        if [ ! -s "$$KEYFILE" ]; then
          head -c 512 /dev/urandom | base64 -w 0 | tr -d '\n' > "$$KEYFILE"
          echo "Generated MongoDB key file."
        fi
        chown 999:999 "$$KEYFILE"
        chmod 400 "$$KEYFILE"
        exec docker-entrypoint.sh mongod --replSet rs0 --bind_ip_all --keyFile "$$KEYFILE"

    environment:
      MONGO_INITDB_ROOT_USERNAME: "sp_admin_156ba86bacf19a8cba711e10"
      MONGO_INITDB_ROOT_PASSWORD: "68c053b792b26ce8cad252f894c143615cce3a7cfc132ab42c1e92ff6246f37c"
      MONGO_INITDB_DATABASE: stockpilot

    volumes:
      - mongodb_data:/data/db
      - mongo_keyfile:/key

    networks:
      - stockpilot-network

    healthcheck:
      test:
        - CMD-SHELL
        - 'mongosh --quiet --username "$$MONGO_INITDB_ROOT_USERNAME" --password "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --eval "quit(db.hello().isWritablePrimary ? 0 : 1)"'
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  mongo-init:
    image: mongo:7.0
    restart: "no"
    depends_on:
      mongodb:
        condition: service_started
    environment:
      MONGO_ROOT_USERNAME: "sp_admin_156ba86bacf19a8cba711e10"
      MONGO_ROOT_PASSWORD: "68c053b792b26ce8cad252f894c143615cce3a7cfc132ab42c1e92ff6246f37c"
      REPLICA_SET_NAME: rs0
      REPLICA_SET_HOST: "mongodb:27017"
    networks:
      - stockpilot-network
    entrypoint: ["bash", "-c"]
    command:
      - |
        set -uo pipefail
        # directConnection keeps this shell pinned to the seeded host; the replica set advertises
        # REPLICA_SET_HOST, which is not resolvable from inside this throwaway container.
        URL="mongodb://$$MONGO_ROOT_USERNAME:$$MONGO_ROOT_PASSWORD@mongodb:27017/?authSource=admin&directConnection=true"
        echo "Waiting for mongod to accept connections..."
        for _ in $$(seq 1 60); do
          mongosh "$$URL" --quiet --eval 'db.adminCommand({ ping: 1 })' > /dev/null 2>&1 && break
          sleep 2
        done
        mongosh "$$URL" --quiet --eval "
          try {
            const status = rs.status();
            print('Replica set already initiated (myState=' + status.myState + ').');
          } catch (error) {
            rs.initiate({ _id: '$$REPLICA_SET_NAME', members: [{ _id: 0, host: '$$REPLICA_SET_HOST' }] });
            print('Replica set initiated.');
          }
        "
        echo "Waiting for a writable primary..."
        ready=0
        for _ in $$(seq 1 30); do
          mongosh "$$URL" --quiet --eval 'quit(db.hello().isWritablePrimary ? 0 : 1)' && ready=1 && break
          sleep 2
        done
        if [ "$$ready" != "1" ]; then
          echo "Replica set did not elect a primary in time." >&2
          exit 1
        fi
        echo "Replica set $$REPLICA_SET_NAME is ready at $$REPLICA_SET_HOST."

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_URL: ${APP_URL:-http://localhost:3000}

    restart: unless-stopped

    ports:
      - "3000:3000"

    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      APP_URL: ${APP_URL:-http://localhost:3000}
      MONGODB_URI: "mongodb://sp_admin_156ba86bacf19a8cba711e10:68c053b792b26ce8cad252f894c143615cce3a7cfc132ab42c1e92ff6246f37c@mongodb:27017/stockpilot?authSource=admin&replicaSet=rs0"
      JWT_ACCESS_SECRET: "4d0bfca0df43b733daf38c60562aa69fdf1127e68f10e79504c8e0da2a9951f2d7ff1896555b530fe6c39dc5731bcc42"
      JWT_REFRESH_SECRET: "cf9ed570b9fce2bd22f14af415dd3e6c4da4354ec1ec64ef81316b388e1ab3ec196753bc9943b120e20ed45c05ada670"

    depends_on:
      mongodb:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully

    networks:
      - stockpilot-network

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
  mongo-express:
    image: mongo-express:1.0.2-20
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: "mongodb://sp_admin_156ba86bacf19a8cba711e10:68c053b792b26ce8cad252f894c143615cce3a7cfc132ab42c1e92ff6246f37c@mongodb:27017/?authSource=admin&directConnection=true"
      ME_CONFIG_BASICAUTH_ENABLED: "true"
      ME_CONFIG_BASICAUTH_USERNAME: "sp_console_98fda466f7f52ff9"
      ME_CONFIG_BASICAUTH_PASSWORD: "b2bb97f3cbec5090cf2e840e0144e3ae7d397b75271afcfc54e7115768e90f93"
    depends_on:
      mongodb:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
    networks:
      - stockpilot-network

volumes:
  mongodb_data:
  mongo_keyfile:

networks:
  stockpilot-network:
    driver: bridge
